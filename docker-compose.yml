services:
  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbib
      POSTGRES_PASSWORD: openbib
      POSTGRES_DB: openbib
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbib"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://openbib:openbib@db:5432/openbib
      REDIS_URL: redis://cache:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # ── Frontend dev server (opt-in: --profile dev) ─────────
  # Live-reload Vite server for in-browser preview/verification;
  # /api is proxied to the api container.
  web-dev:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # ── Frontend test runner (opt-in: --profile test) ──────
  # Runs vitest and regenerates package-lock.json without
  # requiring node/npm on the host.
  web-test:
    image: node:20-alpine
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run test"

  # ── Frontend ────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
