name: Feature request
description: Propose a focused improvement to OpenBib
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the research workflow or user problem before describing a solution.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and `docs/FutureWorks.md` for this idea.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this, and what are they unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior without assuming a specific implementation where possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs have you considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, related tools, or references that clarify the proposal.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I may be able to help implement this feature.
