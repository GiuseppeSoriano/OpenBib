<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Establish the cascade-layer order before any bundled CSS loads:
         later layers win, so pages > components > base > tokens,
         deterministically and independent of bundle order. -->
    <style>
      @layer tokens, base, components, pages, overrides;
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenBib — Academic Reference Manager</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var pref = localStorage.getItem("openbib.theme");
          var dark =
            pref === "dark" ||
            ((!pref || pref === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          /* default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
