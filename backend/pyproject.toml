[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbib-backend"
version = "0.1.0"
description = "Academic paper management platform — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "aiosmtplib>=3.0.2",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
    "fakeredis[lua]>=2.26.0",
]

# CI installs with the full source tree present; without explicit discovery
# setuptools aborts on the flat layout ("multiple top-level packages: app, alembic").
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
# Formatting owns wrapping; typographic punctuation is intentional in bilingual text.
ignore = ["E501", "RUF001", "RUF002", "UP042"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests", "alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in tests requiring Semantic Scholar credentials and network"]

[tool.setuptools.package-data]
"app.auth" = ["assets/*.png"]
